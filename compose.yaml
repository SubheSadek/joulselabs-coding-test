services:
  nginx:
    build:
      context: ./docker
      dockerfile: nginx.dockerfile
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/SellNow
      - ./docker/nginx.default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
      - postgres

  php:
    build:
      context: ./docker
      dockerfile: php.dockerfile
    volumes:
      - ./:/var/www/SellNow
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5430:5432"
    environment:
      POSTGRES_DB: sell_now
      POSTGRES_USER: sell_now
      POSTGRES_PASSWORD: secret
    volumes:
      - sellnow_postgres_data:/var/lib/postgresql/data

  composer:
    profiles: [ "tools" ]
    build:
      context: ./docker
      dockerfile: composer.dockerfile
    volumes:
      - ./:/var/www/SellNow
    working_dir: /var/www/SellNow

  artisan:
    profiles: [ "tools" ]
    build:
      context: ./docker
      dockerfile: php.dockerfile
    volumes:
      - ./:/var/www/SellNow
    working_dir: /var/www/SellNow
    depends_on:
      - postgres
    entrypoint: [ 'php', '/var/www/SellNow/artisan' ]

volumes:
  sellnow_postgres_data:
